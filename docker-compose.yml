version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: befisc_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: befisc_db
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - befisc_network

  mongo-express:
    image: mongo-express:latest
    container_name: befisc_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    depends_on:
      - mongodb
    networks:
      - befisc_network

  # Django web service (uncomment after testing MongoDB)
  web:
    build: .
    container_name: befisc_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=befisc.settings
    depends_on:
      - mongodb
    networks:
      - befisc_network
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  mongodb_data:

networks:
  befisc_network:
    driver: bridge
